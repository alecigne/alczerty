name: Release
run-name: Release ${{ inputs.increment }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      KALAMINE_VERSION: '0.40'
    steps:
      - name: Validate release branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Releases must run from main.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Just
        uses: extractions/setup-just@v4
      - name: Prepare next version
        id: version
        env:
          RELEASE_INCREMENT: ${{ inputs.increment }}
        run: |
          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          latest_tag=$(git tag --list --sort=-version:refname | sed -nE "/$tag_pattern/{p;q;}")
          if [[ -z "$latest_tag" ]]; then
            latest_tag="v$(python -c 'import tomllib; print(tomllib.load(open("layout/alczerty.toml", "rb"))["version"])')"
          fi
          existing_tag=$(git tag --points-at HEAD | sed -nE "/$tag_pattern/{p;q;}")
          if [[ -n "$existing_tag" ]]; then
            echo "::error::This commit is already released as $existing_tag."
            exit 1
          fi

          IFS=. read -r major minor patch <<< "${latest_tag#v}"
          case "$RELEASE_INCREMENT" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *) echo '::error::Choose patch, minor, or major.'; exit 1 ;;
          esac
          release_tag="v${major}.${minor}.${patch}"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Next release: $release_tag"
      - name: Install build tools
        run: |
          python -m pip install "kalamine==$KALAMINE_VERSION"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y x11-xkb-utils xkb-data
      - name: Set build version
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          release_version=${RELEASE_TAG#v}
          sed -i "s/^version = .*/version = \"$release_version\"/" layout/alczerty.toml
      - name: Verify and package layout
        run: just package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/alczerty.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --generate-notes --latest
