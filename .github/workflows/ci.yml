name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.org'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.org'

permissions:
  contents: read

env:
  KALAMINE_VERSION: '0.40'

jobs:
  verify:
    name: Verify layout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Just
        uses: extractions/setup-just@v4
      - name: Install build tools
        run: |
          python -m pip install "kalamine==$KALAMINE_VERSION"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y x11-xkb-utils xkb-data
      - name: Verify layout
        run: just check
